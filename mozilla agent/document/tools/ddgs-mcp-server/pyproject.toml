[project]
name = "ddgs-mcp-server"
version = "0.1.0"
description = "Pinned DDGS MCP wrapper for the Know Your Docs starter kit"
requires-python = ">=3.11"
dependencies = ["ddgs[api,mcp]==9.14.2"]

[project.scripts]
ddgs-mcp-server = "ddgs_mcp_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddgs_mcp_server"]
